
name: AI Evaluation Regression Gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-agent-evaluation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run deterministic evaluation tests
        run: |
          python -m pytest graph/tests/evaluation \
            -v \
            --junitxml=graph/tests/evaluation/pytest-results.xml \
            --ignore=graph/tests/evaluation/test_intent_accuracy.py

      - name: Run agent routing evaluation
        if: success()
        run: |
          python graph/tests/evaluation/run_agent_evaluation.py

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-reports
          if-no-files-found: warn
          path: |
            ai-service/graph/tests/evaluation/pytest-results.xml
            ai-service/graph/tests/evaluation/agent_evaluation_results.csv
            ai-service/graph/tests/evaluation/rag_evaluation_results.csv
