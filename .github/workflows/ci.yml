
name: E-commerce Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - cart-service
          - gateway-service
          - notification-service
          - order-service
          - payment-service
          - product-service
          - ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
            elif [ -f pyproject.toml ]; then
              python -m pip install -e ".[dev]"
            else
              echo "No supported dependency file found"
              exit 1
            fi
            
            python -m pip install pytest

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          if find . \
            -type d \( -name .git -o -name .venv -o -name __pycache__ \) -prune -o \
            -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print \
            | grep -q .; then
            python -m pytest -q
          else
            echo "::warning::No Python tests found"
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ecommerce-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/ecommerce-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests when configured
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo "::warning::No frontend test script configured"
          fi

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - cart-service
          - gateway-service
          - notification-service
          - order-service
          - payment-service
          - product-service
          - ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t "ci-${{ matrix.service }}:${{ github.sha }}" \
            "./${{ matrix.service }}"
