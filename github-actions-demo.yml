name: Build and Publish Docker Images
run-name: ${{ github.actor }} - build and push service images
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service images
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for *-service directories with Dockerfile..."
          for dir in */ ; do
            if [[ "${dir}" == *-service/ ]]; then
              if [[ -f "${dir}Dockerfile" ]]; then
                svc=${dir%/}
                image=ghcr.io/${{ github.repository_owner }}/${svc}:${{ github.sha }}
                echo "Building and pushing ${image} from ${dir}"
                docker buildx build --push --platform linux/amd64,linux/arm64 -t "${image}" "${dir}"
              else
                echo "Skipping ${dir} (no Dockerfile)"
              fi
            fi
          done

      - name: List built images (local cache)
        if: always()
        run: docker images --format '{{.Repository}}:{{.Tag}}'
