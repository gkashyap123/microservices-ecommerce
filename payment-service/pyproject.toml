[project]
name = "payment-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.6.2",
    "alembic>=1.18.4",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "razorpay>=2.0.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.29.0",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "clients", "core", "models", "repositories", "schemas", "services"]

[tool.setuptools.package-dir]
"" = "."
