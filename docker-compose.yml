services:

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"

  product-db:
    image: postgres:16
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"

  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  gateway-service:
    build: ./gateway-service
    env_file:
      - ./gateway-service/.env
    ports:
      - "8000:8000"

  auth-service:
    build: ./auth-service
    env_file:
      - ./auth-service/.env
    depends_on:
      - auth-db
    ports:
      - "8001:8000"

  product-service:
    build: ./product-service
    env_file:
      - ./product-service/.env
    depends_on:
      - product-db
    ports:
      - "8002:8000"

  cart-service:
    build: ./cart-service
    env_file:
      - ./cart-service/.env
    depends_on:
      - redis
    ports:
      - "8003:8000"

  order-service:
    build: ./order-service
    env_file:
      - ./order-service/.env
    depends_on:
      - order-db
    ports:
      - "8004:8000"

  payment-service:
    build: ./payment-service
    env_file:
      - ./payment-service/.env
    depends_on:
      - payment-db
    ports:
      - "8005:8000"
  
  frontend:
    build: ./frontend/ecommerce-ui
    ports:
      - "5173:5173"
