services:
  product-db:
    image: postgres:16
    container_name: product-db-container
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: productdb
    ports:
      - "5434:5432"    # 5434 → avoids conflict with auth-service
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-product

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5051:80"

    depends_on:
      - product-db

volumes:
  postgres_data:            